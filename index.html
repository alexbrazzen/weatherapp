<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>himmel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e8eaf0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
    .logo { font-size: 20px; color: #c5d8f5; font-weight: 300; letter-spacing: 2px; }
    .live { font-size: 11px; color: rgba(255,255,255,0.25); display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; background: #5DCAA5; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .hero { padding: 40px 24px 24px; }
    .location { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 8px; }
    .temp { font-size: 80px; line-height: 1; margin-bottom: 8px; }
    .desc { font-size: 16px; color: rgba(255,255,255,0.45); margin-bottom: 8px; font-weight: 300; }
    .consensus { font-size: 13px; color: rgba(255,255,255,0.25); margin-bottom: 24px; }
    .consensus span { color: #5DCAA5; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
    .pill { background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: rgba(255,255,255,0.45); }
    .section-label { font-size: 11px; color: rgba(255,255,255,0.25); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; padding-top: 20px; border-top: 0.5px solid rgba(255,255,255,0.06); }
    .sources { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .source-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px 16px; }
    .source-name { font-size: 13px; color: rgba(255,255,255,0.5); width: 80px; flex-shrink: 0; }
    .source-temp { font-size: 18px; font-weight: 500; color: #e8eaf0; width: 50px; }
    .source-desc { font-size: 12px; color: rgba(255,255,255,0.3); flex: 1; }
    .source-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .hourly { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; }
    .hcell { min-width: 60px; background: rgba(255,255,255,0.04); border: 0.5px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 8px; text-align: center; flex-shrink: 0; }
    .hcell.now { background: rgba(122,179,232,0.12); border-color: rgba(122,179,232,0.3); }
    .ht { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
    .hi { font-size: 20px; }
    .htemp { font-size: 14px; font-weight: 500; margin-top: 6px; }
    .hrain { font-size: 11px; color: #5DCAA5; margin-top: 3px; }
    .conf-section { margin-bottom: 24px; }
    .conf-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .conf-label { font-size: 12px; color: rgba(255,255,255,0.35); width: 70px; }
    .conf-track { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
    .conf-val { font-size: 12px; width: 36px; text-align: right; }
    footer { padding: 16px 24px; border-top: 0.5px solid rgba(255,255,255,0.06); font-size: 11px; color: rgba(255,255,255,0.2); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">himmel</div>
    <div class="live"><div class="dot"></div> live</div>
  </nav>
  <div class="hero">
    <div class="location">📍 Malmö, Skåne</div>
    <div class="temp" id="temp">–°</div>
    <div class="desc" id="desc">Hämtar väder...</div>
    <div class="consensus" id="consensus"></div>
    <div class="pills" id="pills"></div>

    <div class="section-label">Källor & precision</div>
    <div class="sources" id="sources"></div>

    <div class="section-label">Timvis idag</div>
    <div class="hourly" id="hourly"></div>

    <div class="section-label">Prognosträffsäkerhet</div>
    <div class="conf-section" id="conf"></div>
  </div>
  <footer>
    <span id="updated">Uppdaterar...</span>
    <span>ECMWF · DWD · Met Norway</span>
  </footer>

  <script>
    const WMO = {0:"Klart",1:"Mest klart",2:"Delvis molnigt",3:"Mulet",45:"Dimma",51:"Duggregn",61:"Regn",63:"Regn",65:"Kraftigt regn",71:"Snö",80:"Skurar",95:"Åska"};
    const ICON = {0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",51:"🌦",61:"🌧",63:"🌧",65:"🌧",71:"❄️",80:"🌦",95:"⛈"};
    const LAT = 55.6059, LON = 13.0007;

    async function fetchModel(model) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=temperature_2m,weathercode,precipitation&timezone=Europe/Stockholm&forecast_days=1&models=${model}`;
      const r = await fetch(url);
      return r.json();
    }

    async function load() {
      const models = [
        { id: "ecmwf_ifs025", name: "ECMWF", color: "#7ab3e8" },
        { id: "dwd_icon_d2", name: "DWD", color: "#5DCAA5" },
        { id: "metno_nordic", name: "Met Norway", color: "#AFA9EC" }
      ];

      const results = await Promise.allSettled(models.map(m => fetchModel(m.id)));

      const temps = [];
      const sourcesHTML = [];

      results.forEach((res, i) => {
        if (res.status === "fulfilled" && res.value.current_weather) {
          const t = Math.round(res.value.current_weather.temperature);
          const code = res.value.current_weather.weathercode;
          temps.push(t);
          sourcesHTML.push(`
            <div class="source-row">
              <div class="source-dot" style="background:${models[i].color}"></div>
              <div class="source-name">${models[i].name}</div>
              <div class="source-temp">${t}°</div>
              <div class="source-desc">${WMO[code] || "–"}</div>
            </div>
          `);
        }
      });

      const avg = Math.round(temps.reduce((a, b) => a + b, 0) / temps.length);
      const spread = Math.max(...temps) - Math.min(...temps);
      const agreement = spread <= 1 ? "Hög" : spread <= 2 ? "God" : "Måttlig";
      const agreementColor = spread <= 1 ? "#5DCAA5" : spread <= 2 ? "#7ab3e8" : "#EF9F27";

      document.getElementById("temp").textContent = avg + "°";

      const firstValid = results.find(r => r.status === "fulfilled" && r.value.current_weather);
      const mainCode = firstValid ? firstValid.value.current_weather.weathercode : 0;
      document.getElementById("desc").textContent = WMO[mainCode] || "–";
      document.getElementById("consensus").innerHTML = `Konsensus från ${temps.length} källor · Modellöverensstämmelse: <span style="color:${agreementColor}">${agreement}</span>`;
      document.getElementById("sources").innerHTML = sourcesHTML.join("");

      document.getElementById("pills").innerHTML = `
        <div class="pill">💨 ${firstValid?.value.current_weather?.windspeed || "–"} m/s</div>
        <div class="pill">📊 ${temps.length} modeller</div>
        <div class="pill">Spread: ±${spread}°</div>
      `;

      const hourData = firstValid?.value?.hourly;
      if (hourData) {
        const now = new Date().getHours();
        let html = "";
        for (let i = 0; i < 8; i++) {
          const idx = now + i;
          const h = new Date(hourData.time[idx]).getHours();
          const t = Math.round(hourData.temperature_2m[idx]);
          const code = hourData.weathercode[idx];
          const rain = hourData.precipitation[idx];
          html += `<div class="hcell${i===0?" now":""}">
            <div class="ht">${i===0?"Nu":h+":00"}</div>
            <div class="hi">${ICON[code]||"🌡"}</div>
            <div class="htemp">${t}°</div>
            ${rain>0?`<div class="hrain">${rain}mm</div>`:""}
          </div>`;
        }
        document.getElementById("hourly").innerHTML = html;
      }

      const confData = [
        { label: "Idag", pct: Math.max(70, 100 - spread * 15), color: "#5DCAA5" },
        { label: "Imorgon", pct: Math.max(55, 85 - spread * 15), color: "#7ab3e8" },
        { label: "Dag 3–4", pct: Math.max(40, 65 - spread * 10), color: "#EF9F27" },
        { label: "Dag 5–7", pct: 40, color: "rgba(255,255,255,0.2)" }
      ];
      document.getElementById("conf").innerHTML = confData.map(c => `
        <div class="conf-row">
          <div class="conf-label">${c.label}</div>
          <div class="conf-track"><div class="conf-fill" style="width:${c.pct}%;background:${c.color}"></div></div>
          <div class="conf-val" style="color:${c.color}">${c.pct}%</div>
        </div>
      `).join("");

      document.getElementById("updated").textContent = "Uppdaterad " + new Date().toLocaleTimeString("sv-SE", {hour:"2-digit",minute:"2-digit"});
    }

    load();
    setInterval(load, 3600000);
  </script>
</body>
</html>
