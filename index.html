<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>himmel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
body{
  background:
  radial-gradient(
    circle at top right,
    rgba(122,179,232,0.08),
    transparent 35%
  ),
  linear-gradient(
    180deg,
    #171c28 0%,
    #0f1117 55%,
    #090b10 100%
  );

  color:#e8eaf0;
  font-family:'DM Sans',sans-serif;
  min-height:100vh;

  transition:background 1.5s ease;
    .canvas{position:fixed;top:0;left:0;width:100%;height:100vh;pointer-events:none;overflow:hidden;z-index:0}
    nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:0.5px solid rgba(255,255,255,0.07);position:relative;z-index:2}
    .logo{font-family:'DM Serif Display',serif;font-size:20px;color:#c5d8f5}
    .live{font-size:11px;color:rgba(255,255,255,0.25);display:flex;align-items:center;gap:6px}
    .dot{width:6px;height:6px;background:#5DCAA5;border-radius:50%;animation:pulse 2s infinite}
    .search-bar{padding:12px 20px;border-bottom:0.5px solid rgba(255,255,255,0.07);position:relative;z-index:2;display:flex;gap:8px}
    .search-bar input{flex:1;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:8px 16px;font-size:13px;color:#e8eaf0;font-family:'DM Sans',sans-serif;outline:none}
    .search-bar input::placeholder{color:rgba(255,255,255,0.25)}
    .search-bar button{background:rgba(122,179,232,0.15);border:0.5px solid rgba(122,179,232,0.3);border-radius:20px;padding:8px 16px;font-size:13px;color:#c5d8f5;font-family:'DM Sans',sans-serif;cursor:pointer}
    .hero{padding:32px 20px 20px;position:relative;z-index:2}
    .loc{font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
    .loc-btn{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:3px 10px;font-size:11px;color:rgba(255,255,255,0.35);cursor:pointer;font-family:'DM Sans',sans-serif}
    .temp{font-family:'DM Serif Display',serif;font-size:80px;line-height:1;color:#e8eaf0}
    .desc{font-size:15px;color:rgba(255,255,255,0.4);margin-top:6px;font-weight:300;margin-bottom:8px}
    .consensus{font-size:12px;color:rgba(255,255,255,0.2);margin-bottom:20px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
    .stat{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;text-align:center}
    .stat-val{font-size:18px;font-weight:500}
    .stat-lbl{font-size:11px;color:rgba(255,255,255,0.25);margin-top:3px}
    .section-label{font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:10px;padding-top:18px;border-top:0.5px solid rgba(255,255,255,0.06)}
    .hourly{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
    .hcell{min-width:56px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 6px;text-align:center;flex-shrink:0;transition:background 0.2s}
    .hcell:hover{background:rgba(255,255,255,0.08)}
    .hcell.now{background:rgba(122,179,232,0.12);border-color:rgba(122,179,232,0.3)}
    .ht{font-size:11px;color:rgba(255,255,255,0.25);margin-bottom:5px}
    .hi{font-size:18px}
    .htemp{font-size:13px;font-weight:500;margin-top:5px}
    .hrain{font-size:11px;color:#5DCAA5;margin-top:3px}
    .sources{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
    .srow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 14px;transition:background 0.2s}
    .srow:hover{background:rgba(255,255,255,0.06)}
    .sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .sname{font-size:12px;color:rgba(255,255,255,0.4);width:80px}
    .stemp{font-size:16px;font-weight:500;width:40px}
    .sdesc{font-size:12px;color:rgba(255,255,255,0.25);flex:1}
    .conf-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .conf-label{font-size:12px;color:rgba(255,255,255,0.3);width:65px}
    .conf-track{flex:1;height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden}
    .conf-fill{height:100%;border-radius:2px;transition:width 1s ease}
    .conf-val{font-size:12px;width:32px;text-align:right}
    .loading{padding:60px 24px;text-align:center;color:rgba(255,255,255,0.3);font-size:14px;position:relative;z-index:2}
    .error-msg{padding:40px 24px;color:rgba(255,255,255,0.4);font-size:14px;position:relative;z-index:2;line-height:1.8}
    footer{padding:12px 20px;border-top:0.5px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.2);position:relative;z-index:2;flex-wrap:wrap;gap:6px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes rain{0%{transform:translateY(-10px) translateX(0);opacity:0}10%{opacity:0.6}90%{opacity:0.4}100%{transform:translateY(110vh) translateX(-30px);opacity:0}}
    @keyframes wind{0%{transform:translateX(-100px);opacity:0}20%{opacity:0.35}80%{opacity:0.25}100%{transform:translateX(110vw);opacity:0}}
    @keyframes snow{0%{transform:translateY(-10px) translateX(0) rotate(0deg);opacity:0}10%{opacity:0.8}90%{opacity:0.5}100%{transform:translateY(110vh) translateX(40px) rotate(360deg);opacity:0}}
    @keyframes sunrotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes sunpulse{0%,100%{opacity:0.15}50%{opacity:0.28}}
    @keyframes clouddrift{0%{transform:translateX(0)}50%{transform:translateX(12px)}100%{transform:translateX(0)}}
    .rain-drop{position:absolute;width:1.5px;border-radius:1px;background:rgba(122,179,232,0.55);animation:rain linear infinite}
    .wind-line{position:absolute;height:1px;border-radius:1px;background:rgba(200,216,240,0.2);animation:wind linear infinite}
    .snow-flake{position:absolute;border-radius:50%;background:rgba(255,255,255,0.85);animation:snow linear infinite}
    .sun-wrap{position:absolute;top:40px;right:60px;width:100px;height:100px;display:flex;align-items:center;justify-content:center}
    .sun-core{width:40px;height:40px;background:rgba(239,159,39,0.2);border-radius:50%;border:0.5px solid rgba(239,159,39,0.25);animation:sunpulse 3s ease-in-out infinite}
    .sun-rays{position:absolute;width:100px;height:100px;animation:sunrotate 14s linear infinite}
    .cloud-shape{position:absolute;background:rgba(180,195,220,0.07);border-radius:30px;animation:clouddrift ease-in-out infinite}
    .section{animation:fadeUp 0.5s ease both}
  </style>
</head>
<body>
  <div class="canvas" id="canvas"></div>
  <nav>
    <div class="logo">himmel</div>
    <div class="live"><div class="dot"></div><span id="live-text">live</span></div>
  </nav>
  <div class="search-bar">
    <input id="search" type="text" placeholder="Sök stad... t.ex. Stockholm" onkeydown="if(event.key==='Enter')searchCity()">
    <button onclick="searchCity()">Sök</button>
  </div>
  <div id="main"><div class="loading">Hämtar din position...</div></div>
  <footer>
    <span id="updated"></span>
    <span>ECMWF · DWD · Met Norway</span>
  </footer>

  <script>
    const WMO={0:"Klart",1:"Mest klart",2:"Delvis molnigt",3:"Mulet",45:"Dimma",51:"Duggregn",61:"Regn",63:"Regn",65:"Kraftigt regn",71:"Snö",80:"Skurar",95:"Åska"};
    const ICON={0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",51:"🌦",61:"🌧",63:"🌧",65:"🌧",71:"❄️",80:"🌦",95:"⛈"};

    function getWeatherType(code,wind){
      if(code>=71&&code<=77) return 'snow';
      if((code>=61&&code<=67)||(code>=80&&code<=82)||code===95||code===99||(code>=51&&code<=57)) return 'rain';
      if(wind>10) return 'wind';
      if(code===0||code===1) return 'sun';
      return 'cloudy';
    }

    function makeRain(){
      const c=document.getElementById('canvas');c.innerHTML='';
      for(let i=0;i<50;i++){const d=document.createElement('div');d.className='rain-drop';const h=10+Math.random()*20;d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*-200}px;height:${h}px;animation-duration:${0.5+Math.random()*0.5}s;animation-delay:${Math.random()*2}s`;c.appendChild(d);}
    }
    function makeWind(){
      const c=document.getElementById('canvas');c.innerHTML='';
      for(let i=0;i<25;i++){const l=document.createElement('div');l.className='wind-line';const w=60+Math.random()*180;l.style.cssText=`top:${Math.random()*100}vh;width:${w}px;animation-duration:${0.8+Math.random()*1}s;animation-delay:${Math.random()*2}s`;c.appendChild(l);}
    }
    function makeSnow(){
      const c=document.getElementById('canvas');c.innerHTML='';
      for(let i=0;i<45;i++){const s=document.createElement('div');s.className='snow-flake';const sz=2+Math.random()*5;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*-150}px;width:${sz}px;height:${sz}px;animation-duration:${2.5+Math.random()*4}s;animation-delay:${Math.random()*4}s`;c.appendChild(s);}
    }
    function makeSun(){
      const c=document.getElementById('canvas');c.innerHTML='';
      const wrap=document.createElement('div');wrap.className='sun-wrap';
      wrap.innerHTML=`<svg class="sun-rays" viewBox="0 0 100 100">${[0,30,60,90,120,150,180,210,240,270,300,330].map(a=>`<line x1="50" y1="8" x2="50" y2="18" stroke="rgba(239,159,39,0.3)" stroke-width="2" transform="rotate(${a} 50 50)"/>`).join('')}</svg><div class="sun-core"></div>`;
      c.appendChild(wrap);
    }
    function makeCloudy(){
      const c=document.getElementById('canvas');c.innerHTML='';
      [[160,40,60,0,4],[120,35,120,30,6],[100,30,180,55,8]].forEach(([w,h,top,left,delay])=>{const cl=document.createElement('div');cl.className='cloud-shape';cl.style.cssText=`width:${w}px;height:${h}px;top:${top}px;left:${left}px;animation-duration:${6+delay}s;animation-delay:${delay*0.3}s`;c.appendChild(cl);});
    }
    function applyAnimation(type){
      const desc=document.getElementById('desc');
      if(desc) desc.style.animation='';
      if(type==='rain') makeRain();
      else if(type==='wind'){makeWind();if(desc){desc.style.display='inline-block';desc.style.animation='wind 6s ease-in-out infinite alternate';}}
      else if(type==='snow') makeSnow();
      else if(type==='sun') makeSun();
      else makeCloudy();
    }

    async function fetchModel(model,lat,lon){
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode,precipitation&timezone=auto&forecast_days=1&models=${model}`);
      return r.json();
    }

    async function getCity(lat,lon){
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=sv`);
        const d=await r.json();
        return d.address.city||d.address.town||d.address.village||d.address.municipality||"Din plats";
      }catch(e){return "Din plats";}
    }

    async function loadWeather(lat,lon,cityName){
      document.getElementById('main').innerHTML='<div class="loading">Hämtar väder...</div>';
      const city=cityName||(await getCity(lat,lon));
      document.getElementById('live-text').textContent=`live · ${city}`;

      const models=[
        {id:"ecmwf_ifs025",name:"ECMWF",color:"#7ab3e8"},
        {id:"dwd_icon_d2",name:"DWD",color:"#5DCAA5"},
        {id:"metno_nordic",name:"Met Norway",color:"#AFA9EC"}
      ];
      const results=await Promise.allSettled(models.map(m=>fetchModel(m.id,lat,lon)));
      const temps=[];const sourcesHTML=[];

      results.forEach((res,i)=>{
        if(res.status==="fulfilled"&&res.value.current_weather){
          const t=Math.round(res.value.current_weather.temperature);
          const code=res.value.current_weather.weathercode;
          temps.push(t);
          sourcesHTML.push(`<div class="srow"><div class="sdot" style="background:${models[i].color}"></div><div class="sname">${models[i].name}</div><div class="stemp">${t}°</div><div class="sdesc">${WMO[code]||"–"}</div></div>`);
        }
      });

      if(temps.length===0){
        document.getElementById('main').innerHTML='<div class="error-msg">Kunde inte hämta väderdata. Försök igen.</div>';
        return;
      }

      const avg=Math.round(temps.reduce((a,b)=>a+b,0)/temps.length);
      const spread=Math.max(...temps)-Math.min(...temps);
      const agreement=spread<=1?"Hög":spread<=2?"God":"Måttlig";
      const agreementColor=spread<=1?"#5DCAA5":spread<=2?"#7ab3e8":"#EF9F27";
      const first=results.find(r=>r.status==="fulfilled"&&r.value.current_weather);
      const mainCode=first?.value.current_weather.weathercode||2;
      const windspeed=first?.value.current_weather.windspeed||0;

      let hourlyHTML='';
      const hourData=first?.value?.hourly;
      if(hourData){
        const now=new Date().getHours();
        for(let i=0;i<8;i++){
          const idx=now+i;
          const h=new Date(hourData.time[idx]).getHours();
          const t=Math.round(hourData.temperature_2m[idx]);
          const code=hourData.weathercode[idx];
          const rain=hourData.precipitation[idx];
          hourlyHTML+=`<div class="hcell${i===0?" now":""}"><div class="ht">${i===0?"Nu":h+":00"}</div><div class="hi">${ICON[code]||"🌡"}</div><div class="htemp">${t}°</div>${rain>0?`<div class="hrain">${rain}mm</div>`:""}</div>`;
        }
      }

      const confData=[
        {label:"Idag",pct:Math.max(70,100-spread*15),color:"#5DCAA5"},
        {label:"Imorgon",pct:Math.max(55,85-spread*15),color:"#7ab3e8"},
        {label:"Dag 3–4",pct:Math.max(40,65-spread*10),color:"#EF9F27"},
        {label:"Dag 5–7",pct:40,color:"rgba(255,255,255,0.2)"}
      ];

      document.getElementById('main').innerHTML=`
        <div class="hero">
          <div class="loc">📍 ${city} <button class="loc-btn" onclick="askLocation()">Använd min plats</button></div>
          <div class="temp">${avg}°</div>
          <div class="desc" id="desc">${WMO[mainCode]||"–"}</div>
          <div class="consensus">Konsensus från ${temps.length} källor · Överensstämmelse: <b style="color:${agreementColor}">${agreement}</b></div>
          <div class="stats">
            <div class="stat"><div class="stat-val">${Math.round(windspeed)} m/s</div><div class="stat-lbl">Vind</div></div>
            <div class="stat"><div class="stat-val">${spread}°</div><div class="stat-lbl">Spread</div></div>
            <div class="stat"><div class="stat-val">${temps.length}</div><div class="stat-lbl">Källor</div></div>
          </div>
          <div class="section" style="animation-delay:0.1s">
            <div class="section-label">Timvis idag</div>
            <div class="hourly">${hourlyHTML}</div>
          </div>
          <div class="section" style="animation-delay:0.2s">
            <div class="section-label">Källor & precision</div>
            <div class="sources">${sourcesHTML.join('')}</div>
          </div>
          <div class="section" style="animation-delay:0.3s">
            <div class="section-label">Prognosträffsäkerhet</div>
            <div>${confData.map(c=>`<div class="conf-row"><div class="conf-label">${c.label}</div><div class="conf-track"><div class="conf-fill" style="width:${c.pct}%;background:${c.color}"></div></div><div class="conf-val" style="color:${c.color}">${c.pct}%</div></div>`).join('')}</div>
          </div>
        </div>`;

      applyAnimation(getWeatherType(mainCode,windspeed));
      document.getElementById('updated').textContent="Uppdaterad "+new Date().toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});
    }

    async function searchCity(){
      const q=document.getElementById('search').value.trim();
      if(!q) return;
      document.getElementById('main').innerHTML=`<div class="loading">Söker efter ${q}...</div>`;
      try{
        const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=sv&format=json`);
        const d=await r.json();
        if(!d.results||d.results.length===0){
          document.getElementById('main').innerHTML='<div class="error-msg">Hittade ingen stad med det namnet. Försök igen!</div>';
          return;
        }
        const city=d.results[0];
        document.getElementById('search').value='';
        loadWeather(city.latitude,city.longitude,city.name);
      }catch(e){
        document.getElementById('main').innerHTML='<div class="error-msg">Något gick fel. Försök igen!</div>';
      }
    }

    function askLocation(){
      if(!navigator.geolocation){
        document.getElementById('main').innerHTML='<div class="error-msg">Din webbläsare stöder inte platsdelning.</div>';
        return;
      }
      document.getElementById('main').innerHTML='<div class="loading">Hämtar din position...</div>';
      navigator.geolocation.getCurrentPosition(
        pos=>loadWeather(pos.coords.latitude,pos.coords.longitude),
        ()=>{document.getElementById('main').innerHTML=`<div class="error-msg">Kunde inte hämta din plats.<br><br><button class="loc-btn" style="font-size:13px;padding:8px 16px" onclick="askLocation()">Försök igen</button></div>`;}
      );
    }

    askLocation();
    setInterval(()=>{if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>loadWeather(pos.coords.latitude,pos.coords.longitude));}},3600000);
  </script>
</body>
</html>
